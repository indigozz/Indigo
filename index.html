<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INDIGO</title>

<style>
body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #ffffff;
  color: #111;
}

/* HEADER */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 20px;
  border-bottom: 1px solid #eee;
}

/* IZQUIERDA */
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo img {
  width: 32px;
  height: 32px;
  object-fit: cover;
  border-radius: 50%;
}

.logo h1 {
  margin: 0;
  font-size: 18px;
  letter-spacing: 3px;
  font-weight: 500;
}

/* DERECHA */
.search-box input {
  padding: 6px 10px;
  border: 1px solid #ccc;
  outline: none;
  font-size: 14px;
}

/* GRID PRODUCTOS */
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
  padding: 20px;
}

.producto {
  text-align: center;
}

.imagen {
  background: #e5e5e5;
  height: 180px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 40px;
  color: #999;
}

.titulo {
  margin: 10px 0 5px;
  font-size: 14px;
}

.boton {
  font-size: 12px;
  border: none;
  background: none;
  cursor: pointer;
}

/* PREGUNTAS */
.preguntas {
  padding: 20px;
  border-top: 1px solid #eee;
}

.preguntas h3 {
  margin-bottom: 10px;
}

.preguntas p {
  font-size: 14px;
  margin: 5px 0;
}

/* RESPONSIVE */
@media (min-width: 768px) {
  .grid {
    grid-template-columns: repeat(4, 1fr);
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <!-- PON TU FLOR AQUÍ -->
    <img src="https://i.imgur.com/1X6wG6F.png">
    <h1>INDIGO</h1>
  </div>

  <div class="search-box">
    <input type="text" placeholder="Buscar">
  </div>
</header>

<section class="grid">

  <!-- PRODUCTOS -->
  <div class="producto">
    <div class="imagen">?</div>
    <div class="titulo">PRONTO</div>
    <button class="boton">AÑADIR AL CARRO</button>
  </div>

  <div class="producto">
    <div class="imagen">?</div>
    <div class="titulo">PRONTO</div>
    <button class="boton">AÑADIR AL CARRO</button>
  </div>

  <div class="producto">
    <div class="imagen">?</div>
    <div class="titulo">PRONTO</div>
    <button class="boton">AÑADIR AL CARRO</button>
  </div>

  <div class="producto">
    <div class="imagen">?</div>
    <div class="titulo">PRONTO</div>
    <button class="boton">AÑADIR AL CARRO</button>
  </div>

</section>

<section class="preguntas">
  <h3>PREGUNTAS</h3>
  <p>¿Cómo comprar? Próximamente disponible.</p>
  <p>¿Métodos de pago? Se informará pronto.</p>
  <p>¿Envíos? Información próximamente.</p>
</section>

</body>
</html>
