<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INDIGO</title>

<style>
:root{
  --rojo:#ff2b2b;
  --blanco:#f5f5f5;
}

/* BASE */
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,#ffffff,#eeeeee);
  display:flex;
  flex-direction:column;
  height:100vh;
}

/* HEADER */
header{
  position:sticky;
  top:0;
  background:var(--rojo);
  color:white;
  text-align:center;
  padding:15px;
  font-size:22px;
  font-weight:bold;
  letter-spacing:3px;
}

/* CONTENIDO */
main{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

/* TEXTO */
.proximamente{
  font-size:clamp(30px, 8vw, 70px);
  font-weight:bold;
  color:var(--rojo);
  letter-spacing:4px;
}

/* DETALLE MODERNO */
.proximamente::after{
  content:"";
  display:block;
  width:60%;
  height:3px;
  background:var(--rojo);
  margin:15px auto 0;
  opacity:0.7;
}
</style>
</head>

<body>

<header>
  INDIGO
</header>

<main>
  <div class="proximamente">PRÓXIMAMENTE</div>
</main>

</body>
</html>
