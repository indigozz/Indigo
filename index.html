<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INDIGO</title>

  <style>
    :root {
      --rojo: #b30000;
      --blanco: #f5f5f5;
      --negro: #0a0a0a;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--blanco);
    }

    header {
      position: sticky;
      top: 0;
      background: var(--rojo);
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 3px;
      z-index: 1000;
    }

    .menu-btn {
      position: absolute;
      left: 15px;
      top: 15px;
      font-size: 22px;
      cursor: pointer;
    }

    .search-btn {
      position: absolute;
      right: 15px;
      top: 15px;
      font-size: 20px;
      cursor: pointer;
    }

    /* BUSCADOR */
    #searchBar {
      display: none;
      width: 100%;
      padding: 10px;
      border: none;
      outline: none;
      font-size: 16px;
    }

    /* RESULTADO */
    #resultado {
      display: none;
      text-align: center;
      font-size: 40px;
      color: var(--rojo);
      margin-top: 50px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    .sidebar {
      position: fixed;
      left: -260px;
      top: 0;
      width: 260px;
      height: 100%;
      background: black;
      color: white;
      padding-top: 60px;
      transition: left 0.3s ease;
      z-index: 2000;
    }

    .sidebar a {
      display: block;
      padding: 15px;
      border-bottom: 1px solid red;
      cursor: pointer;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .card {
      background: var(--negro);
      height: 230px;
      position: relative;
      border: 2px dashed red;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .coming-soon {
      color: white;
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-weight: bold;
    }

    button {
      background: var(--rojo);
      color: white;
      border: none;
      padding: 10px;
      cursor: pointer;
    }

    #popup {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: black;
      color: white;
      padding: 15px 30px;
      border: 2px solid red;
      opacity: 0;
      transition: 0.3s;
    }

    #popup.show {
      opacity: 1;
    }
  </style>
</head>
<body>

<div class="sidebar" id="menu">
  <a onclick="noDisponible()">Compras</a>
  <a onclick="noDisponible()">Ayuda</a>
  <a onclick="noDisponible()">Contacto</a>
</div>

<header>
  <span class="menu-btn" id="menuBtn">☰</span>
  INDIGO
  <span class="search-btn" onclick="toggleSearch()">🔍</span>
</header>

<input type="text" id="searchBar" placeholder="Buscar..." oninput="buscar()">

<div id="resultado">INDIGO</div>

<main id="contenido">
  <section class="grid" id="productos"></section>
</main>

<div id="popup">PRÓXIMAMENTE</div>

<script>
  const menu = document.getElementById("menu");
  const menuBtn = document.getElementById("menuBtn");
  const popup = document.getElementById("popup");

  menuBtn.addEventListener("click", function(e) {
    e.stopPropagation();
    menu.style.left = (menu.style.left === "0px") ? "-260px" : "0px";
  });

  document.addEventListener("click", function(e) {
    if (!menu.contains(e.target) && !menuBtn.contains(e.target)) {
      menu.style.left = "-260px";
    }
  });

  function mostrarPopup(texto) {
    popup.innerText = texto;
    popup.classList.add("show");
    setTimeout(() => popup.classList.remove("show"), 2000);
  }

  function mostrarMensaje() {
    mostrarPopup("PRÓXIMAMENTE");
  }

  function noDisponible() {
    mostrarPopup("NO DISPONIBLE POR EL MOMENTO");
  }

  // PRODUCTOS
  const contenedor = document.getElementById("productos");
  for (let i = 0; i < 20; i++) {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="coming-soon">PRÓXIMAMENTE</div>
      <button onclick="mostrarMensaje()">Comprar</button>
    `;
    contenedor.appendChild(card);
  }

  // BUSCADOR
  function toggleSearch() {
    const bar = document.getElementById("searchBar");
    bar.style.display = (bar.style.display === "block") ? "none" : "block";
  }

  function buscar() {
    const texto = document.getElementById("searchBar").value;
    const resultado = document.getElementById("resultado");
    const contenido = document.getElementById("contenido");

    if (texto.length > 0) {
      resultado.style.display = "block";
      contenido.style.display = "none";
    } else {
      resultado.style.display = "none";
      contenido.style.display = "block";
    }
  }
</script>

</body>
</html>
