<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INDIGO</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: white;
  background: linear-gradient(180deg, #0a0a0a 0%, #111 40%, #0a0a0a 100%);
  height: 100vh;
  overflow: hidden; /* no scroll */
  position: relative;
}

/* HEADER */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px;
}

.menu, .search {
  font-size: 22px;
  cursor: pointer;
}

.logo {
  font-size: 18px;
  letter-spacing: 4px;
}

/* MENSAJE CENTRAL */
.no-disponible {
  height: calc(100vh - 60px);
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.no-disponible h1 {
  font-size: 32px;
  letter-spacing: 3px;
}

/* CARITAS DE FONDO */
.fondo span {
  position: absolute;
  color: rgba(255,255,255,0.05);
  font-size: 20px;
  user-select: none;
}

/* posiciones aleatorias */
.f1 { top: 10%; left: 5%; }
.f2 { top: 30%; right: 10%; }
.f3 { bottom: 20%; left: 15%; }
.f4 { bottom: 10%; right: 5%; }
.f5 { top: 50%; left: 40%; }

/* RESPONSIVE */
@media(min-width:768px){
  .no-disponible h1 {
    font-size: 50px;
  }
}
</style>
</head>

<body>

<header>
  <div class="menu" onclick="menuClick()">☰</div>
  <div class="logo">INDIGO</div>
  <div class="search" onclick="buscar()">🔍</div>
</header>

<!-- MENSAJE -->
<section class="no-disponible">
  <h1>NO DISPONIBLE</h1>
</section>

<!-- FONDO DECORATIVO -->
<div class="fondo">
  <span class="f1">:(</span>
  <span class="f2">:(</span>
  <span class="f3">:(</span>
  <span class="f4">:(</span>
  <span class="f5">:(</span>
</div>

<script>
function menuClick(){
  alert("NO DISPONIBLE");
}

function buscar(){
  alert("NO DISPONIBLE");
}
</script>

</body>
</html>
