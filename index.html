<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INDIGO</title>

  <style>
    :root {
      --rojo: #b30000;
      --blanco: #f5f5f5;
      --negro: #0a0a0a;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--blanco);
    }

    /* HEADER */
    header {
      position: sticky;
      top: 0;
      background: var(--rojo);
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 3px;
      z-index: 1000;
    }

    .menu-btn {
      position: absolute;
      left: 15px;
      top: 15px;
      font-size: 22px;
      cursor: pointer;
    }

    main {
      margin-top: 10px;
    }

    /* SIDEBAR */
    .sidebar {
      position: fixed;
      left: -260px;
      top: 0;
      width: 260px;
      height: 100%;
      background: black;
      color: white;
      padding-top: 60px;
      transition: left 0.3s ease;
      z-index: 2000;
      box-shadow: 5px 0 15px rgba(0,0,0,0.6);
    }

    .sidebar a {
      display: block;
      padding: 15px;
      border-bottom: 1px solid red;
      cursor: pointer;
    }

    .sidebar a:hover {
      background: #111;
    }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    /* CARD */
    .card {
      background: var(--negro);
      height: 230px;
      position: relative;
      border: 2px dashed red;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      transition: transform 0.2s;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .coming-soon {
      color: white;
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-weight: bold;
    }

    button {
      background: var(--rojo);
      color: white;
      border: none;
      padding: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #800000;
    }

    button:active {
      transform: scale(0.95);
    }

    /* POPUP */
    #popup {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: black;
      color: white;
      padding: 15px 30px;
      border: 2px solid red;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 3000;
    }

    #popup.show {
      opacity: 1;
    }
  </style>
</head>
<body>

<!-- MENU -->
<div class="sidebar" id="menu">
  <a onclick="noDisponible()">Compras</a>
  <a onclick="noDisponible()">Ayuda</a>
  <a onclick="noDisponible()">Contacto</a>
</div>

<header>
  <span class="menu-btn" id="menuBtn">☰</span>
  INDIGO
</header>

<main>
  <section class="grid" id="productos"></section>
</main>

<div id="popup">PRÓXIMAMENTE</div>

<script>
  const menu = document.getElementById("menu");
  const menuBtn = document.getElementById("menuBtn");
  const popup = document.getElementById("popup");

  // MENU TOGGLE
  menuBtn.addEventListener("click", function(e) {
    e.stopPropagation();
    menu.style.left = (menu.style.left === "0px") ? "-260px" : "0px";
  });

  // CERRAR MENU AL HACER CLICK FUERA
  document.addEventListener("click", function(e) {
    if (!menu.contains(e.target) && !menuBtn.contains(e.target)) {
      menu.style.left = "-260px";
    }
  });

  // POPUP
  function mostrarPopup(texto) {
    popup.innerText = texto;
    popup.classList.add("show");

    setTimeout(() => {
      popup.classList.remove("show");
    }, 2000);
  }

  function mostrarMensaje() {
    mostrarPopup("PRÓXIMAMENTE");
  }

  function noDisponible() {
    mostrarPopup("NO DISPONIBLE POR EL MOMENTO");
  }

  // GENERAR MUCHOS PRODUCTOS AUTOMÁTICO
  const contenedor = document.getElementById("productos");

  for (let i = 0; i < 20; i++) {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="coming-soon">PRÓXIMAMENTE</div>
      <button onclick="mostrarMensaje()">Comprar</button>
    `;

    contenedor.appendChild(card);
  }
</script>

</body>
</html>
