<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INDIGO</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #121212;
  color: #e0ccff;
}

/* HEADER */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 15px;
  border-bottom: 1px solid #222;
}

/* IZQUIERDA (menu) */
.menu {
  font-size: 22px;
  cursor: pointer;
}

/* CENTRO */
.center {
  display: flex;
  align-items: center;
  gap: 8px;
}

.center h1 {
  margin: 0;
  font-size: 18px;
  letter-spacing: 3px;
}

/* FLOR */
.center img {
  width: 28px;
  height: 28px;
  object-fit: contain;
}

/* DERECHA (lupa) */
.search {
  cursor: pointer;
  font-size: 18px;
}

/* BUSCADOR */
.search-box {
  display: none;
  padding: 10px;
}

.search-box input {
  width: 100%;
  padding: 8px;
  border: none;
  outline: none;
}

/* RESULTADO BUSQUEDA */
.resultado {
  display: none;
  padding: 15px;
  text-align: center;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  padding: 10px;
}

.producto {
  text-align: center;
  cursor: pointer;
}

.imagen {
  background: #2a2a2a;
  height: 140px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 30px;
  color: #666;
}

.titulo {
  font-size: 13px;
  margin: 6px 0;
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #121212;
  padding: 20px;
}

.modal h2 {
  margin-top: 20px;
}

.cerrar {
  position: absolute;
  top: 10px;
  right: 20px;
  font-size: 20px;
  cursor: pointer;
}

/* MORADO SUAVE */
h1, h2 {
  color: #c084fc;
}

/* RESPONSIVE */
@media (min-width: 768px) {
  .grid {
    grid-template-columns: repeat(4, 1fr);
  }
}
</style>
</head>

<body>

<header>
  <!-- IZQUIERDA -->
  <div class="menu">☰</div>

  <!-- CENTRO -->
  <div class="center">
    <h1>INDIGO</h1>
    <img src="https://i.imgur.com/lrtzPh7.jpeg">
  </div>

  <!-- DERECHA -->
  <div class="search" onclick="abrirBusqueda()">🔍</div>
</header>

<div class="search-box" id="searchBox">
  <input type="text" oninput="buscar()" placeholder="Buscar...">
</div>

<div class="resultado" id="resultado">
  PRÓXIMAMENTE
</div>

<section class="grid">

<script>
for(let i=0;i<11;i++){
document.write(`
<div class="producto" onclick="abrirProducto()">
  <div class="imagen">?</div>
  <div class="titulo">PRONTO</div>
</div>
`);
}
</script>

</section>

<!-- MODAL PRODUCTO -->
<div class="modal" id="modal">
  <div class="cerrar" onclick="cerrar()">✕</div>

  <h2>MUY PRONTO</h2>
  <p>Descripción: MUY PRONTO</p>
  <p>Talla: ?</p>
  <p>Color: ?</p>
  <p>Precio: ?</p>
  <p>♡</p>
</div>

<script>
function abrirBusqueda(){
  document.getElementById("searchBox").style.display="block";
}

function buscar(){
  document.getElementById("resultado").style.display="block";
}

function abrirProducto(){
  document.getElementById("modal").style.display="block";
}

function cerrar(){
  document.getElementById("modal").style.display="none";
}
</script>

</body>
</html>
