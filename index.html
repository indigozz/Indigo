<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INDIGO</title>

  <style>
    :root {
      --rojo: rgba(179, 0, 0, 0.8);
      --blanco: #f5f5f5;
      --negro: #0a0a0a;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(to bottom, #f5f5f5, #eaeaea);
    }

    /* HEADER GLASS */
    header {
      position: sticky;
      top: 0;
      backdrop-filter: blur(10px);
      background: rgba(179, 0, 0, 0.6);
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 3px;
      z-index: 1000;
    }

    .menu-btn, .search-btn {
      position: absolute;
      top: 15px;
      font-size: 20px;
      cursor: pointer;
    }

    .menu-btn { left: 15px; }
    .search-btn { right: 15px; }

    /* BUSCADOR iOS */
    #searchBar {
      display: none;
      width: 90%;
      margin: 10px auto;
      padding: 12px;
      border-radius: 20px;
      border: none;
      outline: none;
      backdrop-filter: blur(10px);
      background: rgba(255,255,255,0.6);
    }

    #resultado {
      display: none;
      text-align: center;
      font-size: 40px;
      color: rgba(179,0,0,0.8);
      margin-top: 50px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    /* SIDEBAR MODERNA */
    .sidebar {
      position: fixed;
      left: -260px;
      top: 0;
      width: 260px;
      height: 100%;
      backdrop-filter: blur(15px);
      background: rgba(0,0,0,0.7);
      color: white;
      padding-top: 60px;
      transition: 0.3s;
    }

    .sidebar a {
      display: block;
      padding: 15px;
      border-bottom: 1px solid rgba(255,0,0,0.4);
    }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    /* CARD GLASS */
    .card {
      height: 230px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,0,0,0.3);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .coming-soon {
      text-align: center;
      margin-bottom: auto;
      margin-top: 80px;
      color: white;
      font-weight: bold;
    }

    button {
      border: none;
      border-radius: 15px;
      margin: 10px;
      padding: 10px;
      background: rgba(179,0,0,0.8);
      color: white;
    }

    /* POPUP */
    #popup {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      backdrop-filter: blur(10px);
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 15px 30px;
      border-radius: 20px;
      opacity: 0;
      transition: 0.3s;
    }

    #popup.show {
      opacity: 1;
    }
  </style>
</head>
<body>

<div class="sidebar" id="menu">
  <a onclick="noDisponible()">Compras</a>
  <a onclick="noDisponible()">Ayuda</a>
  <a onclick="noDisponible()">Contacto</a>
</div>

<header>
  <span class="menu-btn" onclick="toggleMenu()">☰</span>
  INDIGO
  <span class="search-btn" onclick="toggleSearch()">🔍</span>
</header>

<input type="text" id="searchBar" placeholder="Buscar..." oninput="buscar()">

<div id="resultado">INDIGO</div>

<main id="contenido">
  <section class="grid" id="productos"></section>
</main>

<div id="popup">PRÓXIMAMENTE</div>

<script>
  const menu = document.getElementById("menu");
  const popup = document.getElementById("popup");

  function toggleMenu() {
    menu.style.left = (menu.style.left === "0px") ? "-260px" : "0px";
  }

  document.addEventListener("click", function(e) {
    if (!menu.contains(e.target) && !e.target.classList.contains("menu-btn")) {
      menu.style.left = "-260px";
    }
  });

  function mostrarPopup(texto) {
    popup.innerText = texto;
    popup.classList.add("show");
    setTimeout(() => popup.classList.remove("show"), 2000);
  }

  function mostrarMensaje() {
    mostrarPopup("PRÓXIMAMENTE");
  }

  function noDisponible() {
    mostrarPopup("NO DISPONIBLE POR EL MOMENTO");
  }

  // PRODUCTOS
  const contenedor = document.getElementById("productos");
  for (let i = 0; i < 20; i++) {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="coming-soon">PRÓXIMAMENTE</div>
      <button onclick="mostrarMensaje()">Comprar</button>
    `;
    contenedor.appendChild(card);
  }

  // BUSCADOR
  function toggleSearch() {
    const bar = document.getElementById("searchBar");
    bar.style.display = (bar.style.display === "block") ? "none" : "block";
  }

  function buscar() {
    const texto = document.getElementById("searchBar").value;
    const resultado = document.getElementById("resultado");
    const contenido = document.getElementById("contenido");

    if (texto.length > 0) {
      resultado.style.display = "block";
      contenido.style.display = "none";
    } else {
      resultado.style.display = "none";
      contenido.style.display = "block";
    }
  }
</script>

</body>
</html>
