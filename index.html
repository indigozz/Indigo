<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INDIGO</title>

<style>
:root{
  --rojo:#ff2b2b;
  --fondo:#ffffff;
  --negro:#111;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:var(--fondo);
}

/* ANIMACIÓN INICIO */
#intro{
  position:fixed;
  width:100%;
  height:100%;
  background:black;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  z-index:9999;
  animation:fadeOut 2s forwards 2s;
}

@keyframes fadeOut{
  to{opacity:0;visibility:hidden;}
}

/* HEADER */
header{
  position:sticky;
  top:0;
  background:var(--rojo);
  color:white;
  padding:15px;
  text-align:center;
  font-weight:bold;
  z-index:1000;
}

.menu-btn,.search-btn,.cart-btn{
  position:absolute;
  top:15px;
  cursor:pointer;
}

.menu-btn{left:15px;}
.search-btn{right:50px;}
.cart-btn{right:15px;}

.cart-count{
  position:absolute;
  top:-5px;
  right:-10px;
  background:black;
  color:white;
  border-radius:50%;
  font-size:12px;
  padding:2px 6px;
}

/* MENU */
.sidebar{
  position:fixed;
  top:0;
  left:-260px;
  width:260px;
  height:100%;
  background:black;
  color:white;
  z-index:2000;
  padding-top:60px;
  transition:0.3s;
}

.sidebar a{
  display:block;
  padding:15px;
  border-bottom:1px solid red;
}

.close-btn{
  position:absolute;
  top:10px;
  right:15px;
  cursor:pointer;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:15px;
  padding:15px;
}

/* CARD */
.card{
  background:#f2f2f2;
  height:200px;
  border-radius:10px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:10px;
}

.coming{
  text-align:center;
  margin-top:60px;
  font-weight:bold;
}

button{
  background:var(--rojo);
  color:white;
  border:none;
  padding:10px;
  border-radius:8px;
}

/* CARRITO PANEL */
#cartPanel{
  position:fixed;
  right:-300px;
  top:0;
  width:300px;
  height:100%;
  background:white;
  z-index:3000;
  transition:0.3s;
  padding:10px;
}

#cartPanel h3{
  margin:0;
}

#cartItems{
  margin-top:10px;
}

/* POPUP */
#popup{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:black;
  color:white;
  padding:10px 20px;
  opacity:0;
  transition:0.3s;
}

#popup.show{opacity:1;}

</style>
</head>

<body>

<div id="intro">BIENVENIDOS A INDIGO</div>

<div class="sidebar" id="menu">
  <span class="close-btn" onclick="toggleMenu()">✖</span>
  <a onclick="noDisponible()">Compras</a>
  <a onclick="noDisponible()">Ayuda</a>
  <a onclick="noDisponible()">Contacto</a>
</div>

<div id="cartPanel">
  <h3>Carrito</h3>
  <div id="cartItems"></div>
</div>

<header>
  <span class="menu-btn" onclick="toggleMenu()">☰</span>
  INDIGO
  <span class="search-btn">⌕</span>
  <span class="cart-btn" onclick="toggleCart()">🛒
    <span class="cart-count" id="cartCount">0</span>
  </span>
</header>

<main>
  <section class="grid" id="productos"></section>
</main>

<div id="popup"></div>

<script>
const menu=document.getElementById("menu");
const cartPanel=document.getElementById("cartPanel");
const popup=document.getElementById("popup");
const cartItems=document.getElementById("cartItems");
const cartCount=document.getElementById("cartCount");

let carrito=[];

/* MENU */
function toggleMenu(){
  menu.style.left = (menu.style.left==="0px") ? "-260px" : "0px";
}

/* CARRITO */
function toggleCart(){
  cartPanel.style.right = (cartPanel.style.right==="0px") ? "-300px" : "0px";
}

function agregar(){
  carrito.push("Producto");
  actualizarCarrito();
  mostrarPopup("AGREGADO AL CARRO");
}

function actualizarCarrito(){
  cartItems.innerHTML="";
  carrito.forEach(p=>{
    const div=document.createElement("div");
    div.innerText=p;
    cartItems.appendChild(div);
  });
  cartCount.innerText=carrito.length;
}

/* POPUP */
function mostrarPopup(texto){
  popup.innerText=texto;
  popup.classList.add("show");
  setTimeout(()=>popup.classList.remove("show"),1500);
}

function noDisponible(){
  mostrarPopup("NO DISPONIBLE");
}

/* PRODUCTOS */
const cont=document.getElementById("productos");
for(let i=0;i<12;i++){
  const card=document.createElement("div");
  card.className="card";
  card.innerHTML=`
    <div class="coming">PRÓXIMAMENTE</div>
    <button onclick="agregar()">AGREGAR AL CARRO</button>
  `;
  cont.appendChild(card);
}
</script>

</body>
</html>
