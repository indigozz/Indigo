<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INDIGO</title>

  <style>
    :root {
      --rojo: #b30000;
      --blanco: #f5f5f5;
      --negro: #0a0a0a;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--blanco);
    }

    /* HEADER */
    header {
      position: sticky;
      top: 0;
      background: var(--rojo);
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 2px;
      z-index: 1000;
    }

    .menu-btn {
      position: absolute;
      left: 15px;
      top: 15px;
      font-size: 20px;
      cursor: pointer;
    }

    main {
      margin-top: 10px;
    }

    /* SIDEBAR */
    .sidebar {
      position: fixed;
      left: -250px;
      top: 0;
      width: 250px;
      height: 100%;
      background: black;
      color: white;
      padding-top: 60px;
      transition: 0.3s;
      z-index: 2000;
    }

    .sidebar a {
      display: block;
      padding: 15px;
      border-bottom: 1px solid red;
      cursor: pointer;
    }

    .sidebar a:hover {
      background: #111;
    }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    /* CARD */
    .card {
      background: var(--negro);
      height: 220px;
      position: relative;
      border: 2px dashed red;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .coming-soon {
      color: white;
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-weight: bold;
    }

    button {
      background: var(--rojo);
      color: white;
      border: none;
      padding: 10px;
      cursor: pointer;
    }

    button:hover {
      background: #800000;
    }

    button:active {
      transform: scale(0.95);
    }

    /* POPUP */
    #popup {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: black;
      color: white;
      padding: 15px 30px;
      border: 2px solid red;
      opacity: 0;
      transition: 0.5s;
      z-index: 3000;
    }

    /* BLOQUEO PAÍS */
    #bloqueo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: black;
      color: white;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 5000;
    }
  </style>
</head>
<body>

<!-- BLOQUEO -->
<div id="bloqueo">
  <div>
    <h2>NO DISPONIBLE</h2>
    <p>Esta página solo está disponible en Chile</p>
  </div>
</div>

<!-- MENU -->
<div class="sidebar" id="menu">
  <a onclick="noDisponible()">Compras</a>
  <a onclick="noDisponible()">Ayuda</a>
  <a onclick="noDisponible()">Contacto</a>
</div>

<header>
  <span class="menu-btn" onclick="toggleMenu()">☰</span>
  INDIGO
</header>

<main>
  <section class="grid">

    <!-- MUCHOS PRODUCTOS -->
    <div class="card"><div class="coming-soon">PRÓXIMAMENTE</div><button onclick="mostrarMensaje()">Comprar</button></div>
    <div class="card"><div class="coming-soon">PRÓXIMAMENTE</div><button onclick="mostrarMensaje()">Comprar</button></div>
    <div class="card"><div class="coming-soon">PRÓXIMAMENTE</div><button onclick="mostrarMensaje()">Comprar</button></div>
    <div class="card"><div class="coming-soon">PRÓXIMAMENTE</div><button onclick="mostrarMensaje()">Comprar</button></div>
    <div class="card"><div class="coming-soon">PRÓXIMAMENTE</div><button onclick="mostrarMensaje()">Comprar</button></div>
    <div class="card"><div class="coming-soon">PRÓXIMAMENTE</div><button onclick="mostrarMensaje()">Comprar</button></div>
    <div class="card"><div class="coming-soon">PRÓXIMAMENTE</div><button onclick="mostrarMensaje()">Comprar</button></div>
    <div class="card"><div class="coming-soon">PRÓXIMAMENTE</div><button onclick="mostrarMensaje()">Comprar</button></div>

  </section>
</main>

<div id="popup">PRÓXIMAMENTE</div>

<script>
  function mostrarMensaje() {
    const popup = document.getElementById("popup");
    popup.innerText = "PRÓXIMAMENTE";
    popup.style.opacity = "1";

    setTimeout(() => {
      popup.style.opacity = "0";
    }, 2000);
  }

  function noDisponible() {
    const popup = document.getElementById("popup");
    popup.innerText = "NO DISPONIBLE POR EL MOMENTO";
    popup.style.opacity = "1";

    setTimeout(() => {
      popup.style.opacity = "0";
    }, 2000);
  }

  function toggleMenu() {
    const menu = document.getElementById("menu");
    menu.style.left = (menu.style.left === "0px") ? "-250px" : "0px";
  }

  // Cerrar menú al tocar fuera
  document.addEventListener("click", function(e) {
    const menu = document.getElementById("menu");

    if (!menu.contains(e.target) && !e.target.classList.contains("menu-btn")) {
      menu.style.left = "-250px";
    }
  });

  // BLOQUEO POR PAÍS (Chile = CL)
  if (navigator.language !== "es-CL") {
    document.getElementById("bloqueo").style.display = "flex";
  }
</script>

</body>
</html>
