<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INDIGO</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #000;
}

/* HEADER */
header {
  background: #2A0A3D; /* morado oscuro tipo 💜 */
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}

/* FLOR */
header img {
  width: 35px;
  height: 35px;
  object-fit: cover;
  border-radius: 50%;
}

/* TEXTO INDIGO */
header h1 {
  color: #fff;
  margin: 0;
  font-size: 20px;
  letter-spacing: 4px;

  /* efecto neón */
  text-shadow:
    0 0 5px #a855f7,
    0 0 10px #a855f7,
    0 0 20px #9333ea;
}

/* MAIN */
.main {
  height: calc(100vh - 60px);
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
}

/* PRÓXIMAMENTE */
.main h2 {
  font-size: 28px;
  letter-spacing: 6px;
  color: #c084fc;

  text-shadow:
    0 0 5px #c084fc,
    0 0 15px #a855f7,
    0 0 30px #9333ea;
}

/* LINEA */
.linea {
  width: 120px;
  height: 2px;
  margin-top: 10px;
  background: #a855f7;

  box-shadow: 0 0 10px #a855f7;
}

/* RESPONSIVE */
@media (max-width: 600px) {
  header h1 {
    font-size: 18px;
  }

  .main h2 {
    font-size: 22px;
  }
}
</style>
</head>

<body>

<header>
  <!-- CAMBIA ESTA URL POR TU FLOR -->
  <img src="https://i.imgur.com/1X6wG6F.png" alt="flor">

  <h1>INDIGO</h1>
</header>

<section class="main">
  <h2>PRÓXIMAMENTE</h2>
  <div class="linea"></div>
</section>

</body>
</html>
