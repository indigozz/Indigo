<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INDIGO</title>

  <style>
    :root {
      --rojo: #b30000;
      --blanco: #f5f5f5;
      --negro: #0a0a0a;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--blanco);
    }

    header {
      position: sticky;
      top: 0;
      background: var(--rojo);
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 24px;
      font-weight: bold;
      z-index: 1000;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .card {
      background: var(--negro);
      height: 220px;
      position: relative;
      border: 2px dashed red;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .coming-soon {
      color: white;
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-weight: bold;
    }

    button {
      background: var(--rojo);
      color: white;
      border: none;
      padding: 10px;
      cursor: pointer;
    }

    button:hover {
      background: #800000;
    }

    #popup {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: black;
      color: white;
      padding: 15px 30px;
      border: 2px solid red;
      opacity: 0;
      transition: 0.5s;
    }
  </style>

</head>
<body>

<header>
  INDIGO
</header>

<main>
  <section class="grid">

    <div class="card">
      <div class="coming-soon">PRÓXIMAMENTE</div>
      <button onclick="mostrarMensaje()">Comprar</button>
    </div>

    <div class="card">
      <div class="coming-soon">PRÓXIMAMENTE</div>
      <button onclick="mostrarMensaje()">Comprar</button>
    </div>

    <div class="card">
      <div class="coming-soon">PRÓXIMAMENTE</div>
      <button onclick="mostrarMensaje()">Comprar</button>
    </div>

    <div class="card">
      <div class="coming-soon">PRÓXIMAMENTE</div>
      <button onclick="mostrarMensaje()">Comprar</button>
    </div>

  </section>
</main>

<div id="popup">PRÓXIMAMENTE</div>

<script>
  function mostrarMensaje() {
    const popup = document.getElementById("popup");

    popup.style.opacity = "1";

    setTimeout(() => {
      popup.style.opacity = "0";
    }, 2000);
  }
</script>

</body>
    </html>
