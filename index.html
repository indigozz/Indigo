<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INDIGO</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0A0A0A;
  color: white;
}

/* HEADER */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px;
  border-bottom: 1px solid #222;
}

/* IZQUIERDA */
.menu {
  font-size: 22px;
  cursor: pointer;
}

/* CENTRO (LOGO TEXTO) */
.logo {
  font-size: 18px;
  letter-spacing: 4px;
}

/* DERECHA */
.search {
  font-size: 18px;
  cursor: pointer;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  padding: 10px;
}

.producto {
  cursor: pointer;
}

.imagen {
  background: #1C1C1C;
  height: 140px;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #555;
  font-size: 30px;
}

.titulo {
  font-size: 13px;
  margin-top: 6px;
  color: #ccc;
}

/* RESPONSIVE */
@media(min-width:768px){
  .grid{
    grid-template-columns: repeat(4,1fr);
  }
}
</style>
</head>

<body>

<header>
  <div class="menu">☰</div>

  <div class="logo">INDIGO</div>

  <div class="search">🔍</div>
</header>

<section class="grid">
<script>
for(let i=0;i<11;i++){
document.write(`
<div class="producto">
  <div class="imagen">?</div>
  <div class="titulo">PRONTO</div>
</div>
`);
}
</script>
</section>

</body>
</html>
