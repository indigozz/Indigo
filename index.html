<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INDIGO</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #1E1E1E;
    }

    /* HEADER */
    header {
      background: #5A4BFF;
      padding: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    header h1 {
      color: white;
      letter-spacing: 5px;
      margin: 0;
      font-size: 22px;
    }

    /* SECCIÓN PRINCIPAL */
    .main {
      height: 90vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .main h2 {
      color: #FF3B3B;
      font-size: 28px;
      letter-spacing: 6px;
      margin-bottom: 10px;
    }

    .linea {
      width: 120px;
      height: 2px;
      background: #FF3B3B;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>

    <!-- Flor moderna (line art, sin relleno) -->
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2C13.5 5 13.5 9 12 12C10.5 9 10.5 5 12 2Z"/>
      <path d="M12 12C15 10.5 19 10.5 22 12C19 13.5 15 13.5 12 12Z"/>
      <path d="M12 12C13.5 15 13.5 19 12 22C10.5 19 10.5 15 12 12Z"/>
      <path d="M12 12C9 13.5 5 13.5 2 12C5 10.5 9 10.5 12 12Z"/>
    </svg>

    <h1>INDIGO</h1>
  </header>

  <!-- CONTENIDO -->
  <section class="main">
    <h2>PRÓXIMAMENTE</h2>
    <div class="linea"></div>
  </section>

</body>
</html>
