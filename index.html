<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INDIGO</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0A0A0A;
  color: white;
}

/* HEADER */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px;
  border-bottom: 1px solid #222;
}

.menu, .search {
  font-size: 22px;
  cursor: pointer;
}

.logo {
  font-size: 18px;
  letter-spacing: 4px;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  padding: 10px;
}

.producto {
  cursor: pointer;
}

.imagen {
  background: #1C1C1C;
  height: 140px;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #555;
  font-size: 30px;
}

.titulo {
  font-size: 13px;
  margin-top: 6px;
  color: #ccc;
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #0A0A0A;
  z-index: 100;
  overflow-y: auto;
}

.modal-img {
  width: 100%;
  height: 300px;
  background: #1C1C1C;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 50px;
  color: #555;
}

.modal-info {
  padding: 15px;
}

.modal-info h2 {
  margin: 10px 0;
}

.modal-info p {
  color: #ccc;
}

.cerrar {
  position: absolute;
  top: 10px;
  right: 20px;
  cursor: pointer;
  font-size: 22px;
}

/* RESPONSIVE */
@media(min-width:768px){
  .grid{
    grid-template-columns: repeat(4,1fr);
  }

  .modal {
    display: flex;
  }

  .modal-img {
    width: 50%;
    height: 100%;
  }

  .modal-info {
    width: 50%;
    padding: 30px;
  }
}
</style>
</head>

<body>

<header>
  <div class="menu" onclick="menuClick()">☰</div>
  <div class="logo">INDIGO</div>
  <div class="search" onclick="buscar()">🔍</div>
</header>

<section class="grid">
<script>
for(let i=0;i<11;i++){
document.write(`
<div class="producto" onclick="abrirProducto()">
  <div class="imagen">?</div>
  <div class="titulo">PRONTO</div>
</div>
`);
}
</script>
</section>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="cerrar" onclick="cerrarProducto()">✕</div>

  <div class="modal-img">?</div>

  <div class="modal-info">
    <h2>PRÓXIMAMENTE</h2>
    <p>PRÓXIMAMENTE</p>
  </div>
</div>

<script>
function menuClick(){
  alert("PRONTO");
}

function buscar(){
  alert("PRÓXIMAMENTE");
}

function abrirProducto(){
  document.getElementById("modal").style.display="block";
}

function cerrarProducto(){
  document.getElementById("modal").style.display="none";
}
</script>

</body>
</html>
