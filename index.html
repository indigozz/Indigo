<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INDIGO</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0A0A0A;
  color: white;
}

/* INTRO */
.intro {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #0A0A0A;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 999;
}

.intro img {
  width: 120px;
}

/* HEADER */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px;
  background: #111; /* mismo tono del logo */
}

/* MENU */
.menu {
  font-size: 22px;
  cursor: pointer;
}

/* LOGO CENTRO */
.logo {
  display: flex;
  justify-content: center;
}

.logo img {
  width: 35px;
}

/* BUSCAR */
.search {
  font-size: 18px;
  cursor: pointer;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  padding: 10px;
}

.producto {
  cursor: pointer;
}

.imagen {
  background: #1C1C1C;
  height: 140px;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #555;
  font-size: 30px;
}

.titulo {
  font-size: 13px;
  margin-top: 6px;
  color: #ccc;
}

/* RESPONSIVE */
@media(min-width:768px){
  .grid{
    grid-template-columns: repeat(4,1fr);
  }
}
</style>
</head>

<body>

<!-- INTRO -->
<div class="intro" id="intro">
  <img src="https://i.imgur.com/Zqh7Mhp.jpeg">
</div>

<!-- HEADER -->
<header>
  <div class="menu">☰</div>

  <div class="logo">
    <img src="https://i.imgur.com/Zqh7Mhp.jpeg">
  </div>

  <div class="search">🔍</div>
</header>

<!-- PRODUCTOS -->
<section class="grid">
<script>
for(let i=0;i<11;i++){
document.write(`
<div class="producto">
  <div class="imagen">?</div>
  <div class="titulo">PRONTO</div>
</div>
`);
}
</script>
</section>

<script>
setTimeout(()=>{
  document.getElementById("intro").style.display="none";
},2000);
</script>

</body>
</html>
